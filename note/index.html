<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>note</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <style>
      html, body { background:#000; height:100%; margin:0; padding:0; overflow:hidden; }
      #notepad { caret-color:#34d399; }
      #notepad::placeholder { color:#1e293b; font-style:italic; font-weight:300; }
      #notepad::-webkit-scrollbar { width:6px; }
      #notepad::-webkit-scrollbar-thumb { background:#1e293b; border-radius:3px; }

      #status-area {
        position:fixed; top:1rem; right:1rem;
        display:flex; align-items:center; gap:.45rem;
        z-index:200; cursor:pointer; user-select:none;
        padding:.25rem .5rem; border-radius:.4rem;
        transition:background .15s;
      }
      #status-area:hover { background:#0f0f0f; }
      #status-area .dot {
        width:.55rem; height:.55rem; border-radius:50%; background:#10b981;
        box-shadow:0 0 8px #10b98188; transition:background-color .3s, box-shadow .3s;
        pointer-events:none;
      }
      #status-area .dot.reconnecting { background:#f59e0b; box-shadow:0 0 6px #f59e0b88; }
      #status-area .dot.offline { background:#ef4444; box-shadow:0 0 5px #ef444488; }
      #status-area #online-count {
        color:#94a3b8; font-size:.7rem; font-family:'SF Mono', monospace;
        letter-spacing:.02em; pointer-events:none; white-space:nowrap;
      }

      #typing-indicator {
        position:fixed; bottom:1rem; left:1rem;
        display:flex; align-items:center; gap:.4rem;
        font-size:.7rem; color:#64748b; font-family:'SF Mono', monospace;
        z-index:100; pointer-events:none; user-select:none;
        opacity:0; transition:opacity .2s ease;
      }
      #typing-indicator.visible { opacity:1; }
      #typing-indicator .dots { display:inline-flex; gap:.15rem; align-items:center; }
      #typing-indicator .dots span {
        width:.25rem; height:.25rem; border-radius:50%;
        background:#34d399; animation:typing-bounce 1.2s infinite ease-in-out;
      }
      #typing-indicator .dots span:nth-child(2) { animation-delay:.15s; }
      #typing-indicator .dots span:nth-child(3) { animation-delay:.3s; }
      @keyframes typing-bounce {
        0%, 60%, 100% { transform:translateY(0); opacity:.4; }
        30% { transform:translateY(-3px); opacity:1; }
      }

      #image-popover {
        position:fixed; top:3.5rem; right:1rem;
        background:#0a0a0a; border:1px solid #1e293b; border-radius:.6rem;
        padding:.75rem; z-index:150;
        box-shadow:0 10px 40px rgba(0,0,0,.8);
        display:none; flex-direction:column; gap:.5rem;
        width:15rem;
      }
      #image-popover.open { display:flex; }
      .img-upload-btn {
        display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
        background:#111; border:1px solid #1e293b; color:#94a3b8; font-size:.75rem;
        padding:.5rem .7rem; border-radius:.4rem; cursor:pointer; width:100%;
        transition:background .12s, border-color .12s, color .12s;
      }
      .img-upload-btn:hover { background:#1e293b; color:#e2e8f0; border-color:#334155; }

      /* ===== EDITOR ===== */
      #editor-wrap {
        position:relative;
        flex:1;
        width:100%;
        overflow:hidden;
        /* textarea is BEHIND the image layer */
      }
      #notepad {
        position:absolute; inset:0;
        width:100%; height:100%;
        background:transparent; resize:none; outline:none;
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size:1.125rem; line-height:1.7;
        color:#e2e8f0; padding:1.5rem;
        z-index:1;                 /* behind images */
      }

      /* image layer is ON TOP of textarea, but click-through */
      #image-layer {
        position:absolute; inset:0;
        z-index:2;
        pointer-events:none;       /* clicks pass through to textarea... */
      }

      /* ...except on the image nodes themselves */
      .img-node {
        position:absolute;
        pointer-events:auto;       /* ...which re-enable clicks */
        cursor:grab;
        user-select:none;
        touch-action:none;
        outline:2px solid transparent;
        outline-offset:3px;
      }
      .img-node.selected { outline-color:#34d399; }
      .img-node.dragging { cursor:grabbing; }
      .img-node img {
        display:block;
        pointer-events:none;
        border-radius:.5rem;
        border:1px solid #1e293b;
        box-shadow:0 4px 20px rgba(0,0,0,.5);
      }
      .img-node .remove {
        position:absolute; top:-10px; right:-10px;
        width:22px; height:22px;
        background:#0f0f0f; border:1px solid #1e293b;
        border-radius:50%; color:#f87171; font-size:12px;
        display:none; align-items:center; justify-content:center;
        cursor:pointer; line-height:1; padding:0;
        z-index:30;
        pointer-events:auto;
      }
      .img-node.selected .remove { display:flex; }
      .img-node .remove:hover { background:#450a0a; color:#fca5a5; border-color:#7f1d1d; }

      .img-node .resize-handle {
        position:absolute; bottom:-8px; right:-8px;
        width:18px; height:18px;
        background:#10b981; border:2px solid #052e16;
        border-radius:50%; cursor:nwse-resize;
        display:none;
        z-index:30;
        pointer-events:auto;
      }
      .img-node.selected .resize-handle { display:block; }

      #img-toolbar {
        position:fixed; z-index:300;
        background:#0a0a0a; border:1px solid #1e293b;
        border-radius:.5rem;
        display:none;
        flex-direction:row;
        align-items:center;
        gap:.15rem;
        padding:.25rem;
        box-shadow:0 10px 30px rgba(0,0,0,.8);
        user-select:none;
      }
      #img-toolbar.open { display:flex; }
      #img-toolbar button {
        background:transparent; border:none; color:#94a3b8;
        font-size:.65rem; padding:.35rem .5rem;
        border-radius:.3rem; cursor:pointer;
        font-family:'SF Mono', monospace;
        transition:background .12s, color .12s;
        white-space:nowrap;
      }
      #img-toolbar button:hover { background:#1e293b; color:#e2e8f0; }
      #img-toolbar button.danger { color:#f87171; }
      #img-toolbar button.danger:hover { background:#450a0a; color:#fca5a5; }
      #img-toolbar .sep { width:1px; height:16px; background:#1e293b; margin:0 .1rem; }

      @keyframes soft-pulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }
      .animate-soft-pulse { animation:soft-pulse 2s infinite ease-in-out; }
    </style>
  </head>
  <body class="bg-black text-slate-100 h-screen flex flex-col font-sans">

    <div id="status-area" title="insert image">
      <div class="dot animate-soft-pulse" id="status-dot"></div>
      <span id="online-count">1</span>
    </div>

    <div id="typing-indicator">
      <span id="typing-text"></span>
      <span class="dots"><span></span><span></span><span></span></span>
    </div>

    <div id="image-popover">
      <label class="img-upload-btn" for="img-upload-input"><span>📷</span> insert image</label>
      <input type="file" id="img-upload-input" accept="image/*" style="display:none" />
    </div>

    <div id="img-toolbar">
      <button data-act="front">front</button>
      <button data-act="back">back</button>
      <div class="sep"></div>
      <button data-act="inline">inline</button>
      <div class="sep"></div>
      <button data-act="smaller">−</button>
      <button data-act="bigger">+</button>
      <div class="sep"></div>
      <button data-act="remove" class="danger">delete</button>
    </div>

    <main class="flex-1 relative w-full mx-auto flex flex-col" style="padding:0;">
      <div id="editor-wrap">
        <textarea id="notepad" placeholder="start typing..." spellcheck="false" autofocus></textarea>
        <div id="image-layer"></div>
      </div>
    </main>

    <script>
      // ============ STATE ============
      const roomId = window.location.hash.slice(1) || 'eez-notepad-default-room';
      if (!window.location.hash) window.location.hash = roomId;

      const textarea       = document.getElementById('notepad');
      const imageLayer     = document.getElementById('image-layer');
      const statusDot      = document.getElementById('status-dot');
      const onlineCountEl  = document.getElementById('online-count');
      const typingIndicator= document.getElementById('typing-indicator');
      const typingText     = document.getElementById('typing-text');
      const imgToolbar     = document.getElementById('img-toolbar');
      const imgPopover     = document.getElementById('image-popover');
      const imgUploadInput = document.getElementById('img-upload-input');
      const statusArea     = document.getElementById('status-area');

      const clientId = 'notepad_' + Math.random().toString(36).slice(2, 9);
      const topic    = 'eez/v1/notepad/' + encodeURIComponent(roomId);

      let isRemoteUpdate = false;
      let peers = new Set([clientId]);
      let peerLastSeen = new Map();
      let typingPeers = new Map();
      let lastTypingSent = 0;

      const images = new Map();   // id -> { dataUrl, x, y, w, h, z }
      const imgNodes = new Map(); // id -> DOM
      let selectedId = null;
      let zCounter = 10;

      const TYPING_TIMEOUT_MS = 2500;
      const TYPING_BROADCAST_MS = 1000;

      // ============ TYPING ============
      function renderTypingIndicator() {
        const now = Date.now();
        for (const [id, ts] of typingPeers.entries()) {
          if (now - ts > TYPING_TIMEOUT_MS) typingPeers.delete(id);
        }
        const count = typingPeers.size;
        if (count === 0) {
          typingIndicator.classList.remove('visible');
          typingText.textContent = '';
        } else {
          typingIndicator.classList.add('visible');
          typingText.textContent = count === 1 ? 'someone is typing' : count + ' people are typing';
        }
      }
      setInterval(renderTypingIndicator, 500);
      function updateOnlineCount() { onlineCountEl.textContent = peers.size; }
      updateOnlineCount();

      // ============ IMAGE NODE ============
      function makeNode(id) {
        const rec = images.get(id);
        if (!rec) return null;

        const node = document.createElement('div');
        node.className = 'img-node';
        node.dataset.id = id;
        node.style.left = rec.x + 'px';
        node.style.top  = rec.y + 'px';
        node.style.zIndex = rec.z;

        const img = document.createElement('img');
        img.src = rec.dataUrl;
        img.draggable = false;
        if (rec.w) img.style.width  = rec.w + 'px';
        if (rec.h) img.style.height = rec.h + 'px';
        node.appendChild(img);

        const del = document.createElement('button');
        del.className = 'remove';
        del.textContent = '✕';
        del.title = 'delete image';
        del.addEventListener('mousedown', (e) => { e.stopPropagation(); e.preventDefault(); });
        del.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); }, { passive: false });
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteImage(id);
        });
        node.appendChild(del);

        const handle = document.createElement('div');
        handle.className = 'resize-handle';
        node.appendChild(handle);

        attachSelect(node, id);
        attachDrag(node, id);
        attachResize(handle, node, id);

        imageLayer.appendChild(node);
        imgNodes.set(id, node);
        return node;
      }

      function updateNode(id) {
        const rec = images.get(id);
        const node = imgNodes.get(id);
        if (!rec || !node) return;
        node.style.left = rec.x + 'px';
        node.style.top  = rec.y + 'px';
        node.style.zIndex = rec.z;
        const img = node.querySelector('img');
        if (img) {
          if (rec.w) img.style.width  = rec.w + 'px'; else img.style.width  = '';
          if (rec.h) img.style.height = rec.h + 'px'; else img.style.height = '';
        }
      }

      function renderAll() {
        images.forEach((_, id) => {
          if (!imgNodes.has(id)) makeNode(id);
          else updateNode(id);
        });
        for (const id of [...imgNodes.keys()]) {
          if (!images.has(id)) {
            imgNodes.get(id).remove();
            imgNodes.delete(id);
          }
        }
      }

      // ============ SELECT ============
      function attachSelect(node, id) {
        // select on press (immediate) — drag will still work because it's the same press
        const onPress = (e) => {
          if (e.target.closest('.remove')) return;
          if (e.target.closest('.resize-handle')) return;
          selectImage(id);
        };
        node.addEventListener('mousedown', onPress);
        node.addEventListener('touchstart', onPress, { passive: true });
      }

      function selectImage(id) {
        if (selectedId && selectedId !== id) {
          const prev = imgNodes.get(selectedId);
          if (prev) prev.classList.remove('selected');
        }
        selectedId = id;
        const node = imgNodes.get(id);
        if (node) {
          node.classList.add('selected');
          positionToolbar(node);
        }
      }

      function deselect() {
        if (selectedId) {
          const prev = imgNodes.get(selectedId);
          if (prev) prev.classList.remove('selected');
        }
        selectedId = null;
        imgToolbar.classList.remove('open');
      }

      function positionToolbar(node) {
        if (!node) return;
        imgToolbar.classList.add('open');
        const r = node.getBoundingClientRect();
        const tw = imgToolbar.offsetWidth || 300;
        const th = imgToolbar.offsetHeight || 34;
        let left = r.left + r.width / 2 - tw / 2;
        let top  = r.top - th - 10;
        left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
        if (top < 8) top = r.bottom + 10;
        imgToolbar.style.left = left + 'px';
        imgToolbar.style.top  = top + 'px';
      }

      // click on textarea / empty space deselects
      textarea.addEventListener('mousedown', () => {
        // only deselect if clicking directly on textarea (not on image overlay)
        // since overlay is above textarea, mousedown here means empty area
        deselect();
      });
      document.addEventListener('mousedown', (e) => {
        if (e.target.closest('.img-node')) return;
        if (e.target.closest('#img-toolbar')) return;
        if (e.target.closest('#image-popover')) return;
        if (e.target.closest('#status-area')) return;
        deselect();
      });

      // ============ DRAG ============
      function attachDrag(node, id) {
        let sx, sy, ox, oy, moved = false, dragging = false;

        function down(e) {
          if (e.target.closest('.remove') || e.target.closest('.resize-handle')) return;
          if (e.button !== undefined && e.button !== 0) return;
          const p = e.touches ? e.touches[0] : e;
          sx = p.clientX; sy = p.clientY;
          const rec = images.get(id);
          if (!rec) return;
          ox = rec.x; oy = rec.y;
          moved = false; dragging = true;
          node.classList.add('dragging');

          window.addEventListener('mousemove', move);
          window.addEventListener('mouseup', up);
          window.addEventListener('touchmove', move, { passive: false });
          window.addEventListener('touchend', up);
        }

        function move(e) {
          if (!dragging) return;
          const p = e.touches ? e.touches[0] : e;
          const dx = p.clientX - sx;
          const dy = p.clientY - sy;
          if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
          if (e.cancelable) e.preventDefault();

          const rec = images.get(id);
          if (!rec) return;
          const lr = imageLayer.getBoundingClientRect();
          const nr = node.getBoundingClientRect();

          let nx = ox + dx;
          let ny = oy + dy;
          nx = Math.max(-nr.width / 2,  Math.min(nx, lr.width  - nr.width / 2));
          ny = Math.max(-nr.height / 2, Math.min(ny, lr.height - nr.height / 2));

          rec.x = nx; rec.y = ny;
          node.style.left = nx + 'px';
          node.style.top  = ny + 'px';
          if (selectedId === id) positionToolbar(node);
        }

        function up() {
          if (!dragging) return;
          dragging = false;
          node.classList.remove('dragging');
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
          window.removeEventListener('touchmove', move);
          window.removeEventListener('touchend', up);
          if (moved) broadcastUpdate(id);
        }

        node.addEventListener('mousedown', down);
        node.addEventListener('touchstart', down, { passive: true });
      }

      // ============ RESIZE ============
      function attachResize(handle, node, id) {
        let sx, sy, sw, sh, aspect;

        function down(e) {
          e.stopPropagation();
          e.preventDefault();
          const p = e.touches ? e.touches[0] : e;
          sx = p.clientX; sy = p.clientY;
          const r = node.getBoundingClientRect();
          sw = r.width; sh = r.height;
          aspect = sw / sh;

          window.addEventListener('mousemove', move);
          window.addEventListener('mouseup', up);
          window.addEventListener('touchmove', move, { passive: false });
          window.addEventListener('touchend', up);
        }

        function move(e) {
          const p = e.touches ? e.touches[0] : e;
          const dx = p.clientX - sx;
          const dy = p.clientY - sy;
          if (e.cancelable) e.preventDefault();

          let nw = sw + dx;
          let nh = sh + dy;
          if (Math.abs(dx) > Math.abs(dy)) nh = nw / aspect;
          else nw = nh * aspect;
          nw = Math.max(40, nw);
          nh = Math.max(40, nh);

          const rec = images.get(id);
          if (!rec) return;
          rec.w = nw; rec.h = nh;
          const img = node.querySelector('img');
          img.style.width  = nw + 'px';
          img.style.height = nh + 'px';
          if (selectedId === id) positionToolbar(node);
        }

        function up() {
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
          window.removeEventListener('touchmove', move);
          window.removeEventListener('touchend', up);
          broadcastUpdate(id);
        }

        handle.addEventListener('mousedown', down);
        handle.addEventListener('touchstart', down, { passive: false });
      }

      // ============ CRUD ============
      function deleteImage(id) {
        images.delete(id);
        const node = imgNodes.get(id);
        if (node) { node.remove(); imgNodes.delete(id); }
        if (selectedId === id) deselect();
        if (client.connected) {
          client.publish(topic, JSON.stringify({ type: 'image_remove', id, clientId }));
        }
      }

      function broadcastAdd(id) {
        const rec = images.get(id);
        if (!rec || !client.connected) return;
        client.publish(topic, JSON.stringify({
          type: 'image_add', id,
          dataUrl: rec.dataUrl,
          x: rec.x, y: rec.y, w: rec.w, h: rec.h, z: rec.z,
          clientId
        }));
      }

      function broadcastUpdate(id) {
        const rec = images.get(id);
        if (!rec || !client.connected) return;
        client.publish(topic, JSON.stringify({
          type: 'image_update', id,
          x: rec.x, y: rec.y, w: rec.w, h: rec.h, z: rec.z,
          clientId
        }));
      }

      // ============ TOOLBAR ============
      imgToolbar.addEventListener('mousedown', (e) => e.stopPropagation());
      imgToolbar.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
      imgToolbar.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn || !selectedId) return;
        const rec = images.get(selectedId);
        if (!rec) return;
        const act = btn.dataset.act;

        if (act === 'front') {
          zCounter++;
          rec.z = zCounter + 100;
          updateNode(selectedId);
          broadcastUpdate(selectedId);
        } else if (act === 'back') {
          zCounter++;
          rec.z = -100 - zCounter;
          updateNode(selectedId);
          broadcastUpdate(selectedId);
        } else if (act === 'bigger') {
          rec.w = (rec.w || 320) * 1.15;
          rec.h = (rec.h || 240) * 1.15;
          updateNode(selectedId);
          broadcastUpdate(selectedId);
          positionToolbar(imgNodes.get(selectedId));
        } else if (act === 'smaller') {
          rec.w = Math.max(40, (rec.w || 320) / 1.15);
          rec.h = Math.max(40, (rec.h || 240) / 1.15);
          updateNode(selectedId);
          broadcastUpdate(selectedId);
          positionToolbar(imgNodes.get(selectedId));
        } else if (act === 'remove') {
          deleteImage(selectedId);
        } else if (act === 'inline') {
          const token = `[[img:${selectedId}]]`;
          const start = textarea.selectionStart;
          const end   = textarea.selectionEnd;
          isRemoteUpdate = true;
          textarea.value = textarea.value.slice(0, start) + token + textarea.value.slice(end);
          const pos = start + token.length;
          try { textarea.setSelectionRange(pos, pos); } catch (err) {}
          isRemoteUpdate = false;
          textarea.focus();
          if (client.connected) {
            client.publish(topic, JSON.stringify({
              type: 'text_update', content: textarea.value, clientId
            }));
          }
          rec.z = -50;
          updateNode(selectedId);
          broadcastUpdate(selectedId);
        }
      });

      // ============ MQTT ============
      const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId, clean: true, connectTimeout: 5000,
      });

      client.on('connect', () => {
        statusDot.className = "dot animate-soft-pulse";
        client.subscribe(topic);
        client.publish(topic, JSON.stringify({ type: 'join', clientId }));
      });
      client.on('reconnect', () => { statusDot.className = "dot animate-soft-pulse reconnecting"; });
      client.on('offline',   () => { statusDot.className = "dot animate-soft-pulse offline"; });

      client.on('message', (t, payload) => {
        try {
          const data = JSON.parse(payload.toString());

          if (data.type === 'join' || data.type === 'ping') {
            if (data.clientId) {
              peers.add(data.clientId);
              peerLastSeen.set(data.clientId, Date.now());
              updateOnlineCount();
            }
            if (data.type === 'join' && data.clientId !== clientId) {
              if (textarea.value) {
                client.publish(topic, JSON.stringify({ type: 'state', content: textarea.value, clientId }));
              }
              images.forEach((rec, id) => {
                client.publish(topic, JSON.stringify({
                  type: 'image_add', id, dataUrl: rec.dataUrl,
                  x: rec.x, y: rec.y, w: rec.w, h: rec.h, z: rec.z, clientId
                }));
              });
            }
          } else if (data.type === 'typing' && data.clientId !== clientId) {
            typingPeers.set(data.clientId, Date.now());
            renderTypingIndicator();
          } else if (data.type === 'state' && !textarea.value) {
            isRemoteUpdate = true;
            textarea.value = data.content;
            isRemoteUpdate = false;
          } else if (data.type === 'text_update' && data.clientId !== clientId) {
            isRemoteUpdate = true;
            const s = textarea.selectionStart, e = textarea.selectionEnd;
            textarea.value = data.content;
            try { textarea.setSelectionRange(s, e); } catch (err) {}
            isRemoteUpdate = false;
            typingPeers.delete(data.clientId);
            renderTypingIndicator();
          } else if (data.type === 'image_add' && data.id && data.dataUrl) {
            images.set(data.id, {
              dataUrl: data.dataUrl,
              x: data.x ?? 40, y: data.y ?? 40,
              w: data.w ?? null, h: data.h ?? null,
              z: data.z ?? 10,
            });
            renderAll();
          } else if (data.type === 'image_update' && data.id) {
            const rec = images.get(data.id);
            if (rec) {
              if (typeof data.x === 'number') rec.x = data.x;
              if (typeof data.y === 'number') rec.y = data.y;
              if (data.w !== undefined) rec.w = data.w;
              if (data.h !== undefined) rec.h = data.h;
              if (data.z !== undefined) rec.z = data.z;
              updateNode(data.id);
              if (selectedId === data.id) positionToolbar(imgNodes.get(data.id));
            }
          } else if (data.type === 'image_remove' && data.id) {
            images.delete(data.id);
            const node = imgNodes.get(data.id);
            if (node) { node.remove(); imgNodes.delete(data.id); }
            if (selectedId === data.id) deselect();
          } else if (data.type === 'clear') {
            isRemoteUpdate = true;
            textarea.value = '';
            isRemoteUpdate = false;
            images.clear();
            for (const id of [...imgNodes.keys()]) {
              imgNodes.get(id).remove();
              imgNodes.delete(id);
            }
            deselect();
          }
        } catch (e) {}
      });

      // ============ LOCAL TYPING ============
      textarea.addEventListener('input', () => {
        if (isRemoteUpdate) return;
        client.publish(topic, JSON.stringify({
          type: 'text_update', content: textarea.value, clientId
        }));
        const now = Date.now();
        if (now - lastTypingSent > TYPING_BROADCAST_MS) {
          lastTypingSent = now;
          client.publish(topic, JSON.stringify({ type: 'typing', clientId }));
        }
      });

      setInterval(() => {
        if (client.connected) {
          client.publish(topic, JSON.stringify({ type: 'ping', clientId }));
        }
        const now = Date.now();
        let changed = false;
        for (const [id, last] of peerLastSeen.entries()) {
          if (now - last > 35000 && id !== clientId) {
            peers.delete(id);
            peerLastSeen.delete(id);
            typingPeers.delete(id);
            changed = true;
          }
        }
        if (changed) updateOnlineCount();
      }, 15000);

      // ============ POPOVER ============
      function togglePopover(open) {
        const should = open !== undefined ? open : !imgPopover.classList.contains('open');
        imgPopover.classList.toggle('open', should);
      }
      statusArea.addEventListener('click', (e) => { e.stopPropagation(); togglePopover(); });
      document.addEventListener('click', (e) => {
        if (!imgPopover.classList.contains('open')) return;
        if (imgPopover.contains(e.target) || statusArea.contains(e.target)) return;
        togglePopover(false);
      });

      // ============ UPLOAD ============
      imgUploadInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const id = 'img_' + Math.random().toString(36).slice(2, 10);
          const offset = (images.size % 8) * 30;
          zCounter++;
          const rec = {
            dataUrl: ev.target.result,
            x: 60 + offset, y: 60 + offset,
            w: null, h: null,
            z: zCounter + 10,
          };
          images.set(id, rec);
          const node = makeNode(id);
          const img = node.querySelector('img');
          const finalize = () => {
            if (!rec.w && img.naturalWidth) {
              const maxW = Math.min(560, imageLayer.clientWidth - 120);
              const ratio = img.naturalWidth / img.naturalHeight;
              rec.w = Math.min(img.naturalWidth, maxW);
              rec.h = rec.w / ratio;
              updateNode(id);
            }
            broadcastAdd(id);
          };
          if (img.complete) finalize();
          else img.onload = finalize;
          togglePopover(false);
        };
        reader.readAsDataURL(file);
        imgUploadInput.value = '';
      });

      window.addEventListener('resize', () => {
        if (selectedId) {
          const node = imgNodes.get(selectedId);
          if (node) positionToolbar(node);
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') deselect();
        if (e.key === 'Delete' && selectedId && document.activeElement !== textarea) {
          deleteImage(selectedId);
        }
      });
    </script>
  </body>
</html>
