<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>note · live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
  <style>
    html, body {
      background: #000000;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      flex: 1;
      display: flex;
      padding: 1.5rem;
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    #notepad {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: #e2e8f0;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      font-size: 1.125rem;
      line-height: 1.7;
      padding: 0;
      caret-color: #34d399;
      transition: box-shadow 0.2s ease;
    }
    #notepad:focus {
      outline: none;
      box-shadow: none;
    }
    #notepad::placeholder {
      color: #334155;
      font-style: italic;
      font-weight: 300;
    }
    #notepad::-webkit-scrollbar {
      width: 6px;
    }
    #notepad::-webkit-scrollbar-track {
      background: transparent;
    }
    #notepad::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    #notepad::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* tiny floating status dot (only visible indication) */
    #status-dot {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b98188;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      z-index: 50;
    }
    #status-dot.reconnecting {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b88;
    }
    #status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 6px #ef444488;
    }

    /* tiny floating char counter — bottom right, very subtle */
    #char-count {
      position: fixed;
      bottom: 0.75rem;
      right: 1rem;
      font-size: 0.65rem;
      color: #334155;
      font-family: 'SF Mono', monospace;
      letter-spacing: 0.02em;
      z-index: 50;
      pointer-events: none;
      user-select: none;
    }

    /* floating action buttons (appear on hover of main, or always faint) */
    #actions {
      position: fixed;
      top: 1rem;
      left: 1rem;
      display: flex;
      gap: 0.5rem;
      opacity: 0.25;
      transition: opacity 0.2s ease;
      z-index: 50;
    }
    #actions:hover {
      opacity: 1;
    }
    #actions button {
      background: #111;
      border: 1px solid #1e293b;
      color: #64748b;
      font-size: 0.65rem;
      padding: 0.3rem 0.7rem;
      border-radius: 0.4rem;
      cursor: pointer;
      font-family: system-ui, sans-serif;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    #actions button:hover {
      background: #1e293b;
      color: #e2e8f0;
      border-color: #334155;
    }
    #actions button:active {
      transform: scale(0.95);
    }
    #actions button.danger {
      color: #f87171;
      border-color: #450a0a;
    }
    #actions button.danger:hover {
      background: #450a0a;
      color: #fca5a5;
    }

    @keyframes soft-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-soft-pulse {
      animation: soft-pulse 2s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <!-- minimal floating status dot -->
  <div id="status-dot" class="animate-soft-pulse"></div>

  <!-- floating actions -->
  <div id="actions">
    <button id="copy-btn">share</button>
    <button id="clear-btn" class="danger">clear</button>
  </div>

  <!-- character count (subtle) -->
  <div id="char-count">0</div>

  <!-- full screen notepad -->
  <main>
    <textarea
      id="notepad"
      placeholder="start typing…"
      spellcheck="false"
      autofocus
    ></textarea>
  </main>

  <script>
    (function() {
      // ---- room & elements ----
      const roomId = window.location.hash.slice(1) || 'note-default-room';
      if (!window.location.hash) window.location.hash = roomId;

      const textarea = document.getElementById('notepad');
      const statusDot = document.getElementById('status-dot');
      const charCountEl = document.getElementById('char-count');
      const copyBtn = document.getElementById('copy-btn');
      const clearBtn = document.getElementById('clear-btn');

      // ---- client identity ----
      const clientId = 'note_' + Math.random().toString(36).slice(2, 9);
      const topic = 'eez/v1/notepad/' + encodeURIComponent(roomId);

      let isRemoteUpdate = false;
      let peers = new Set([clientId]);
      let lastTypingBroadcast = 0;
      const TYPING_THROTTLE_MS = 50;

      // ---- MQTT connection ----
      const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId,
        clean: true,
        connectTimeout: 5000,
        reconnectPeriod: 2000,
      });

      // ---- connection status (dot only) ----
      function setStatus(mode) {
        statusDot.className = '';
        if (mode === 'live') {
          statusDot.classList.add('animate-soft-pulse');
          statusDot.style.background = '#10b981';
          statusDot.style.boxShadow = '0 0 10px #10b98188';
        } else if (mode === 'reconnecting') {
          statusDot.classList.add('animate-soft-pulse');
          statusDot.style.background = '#f59e0b';
          statusDot.style.boxShadow = '0 0 8px #f59e0b88';
        } else if (mode === 'offline') {
          statusDot.classList.add('animate-soft-pulse');
          statusDot.style.background = '#ef4444';
          statusDot.style.boxShadow = '0 0 6px #ef444488';
        }
      }

      client.on('connect', () => {
        setStatus('live');
        client.subscribe(topic);
        client.publish(topic, JSON.stringify({ type: 'join', clientId }));
        if (textarea.value.trim().length > 0) {
          client.publish(topic, JSON.stringify({ type: 'state', content: textarea.value, clientId }));
        }
      });

      client.on('reconnect', () => setStatus('reconnecting'));
      client.on('offline', () => setStatus('offline'));
      client.on('error', (err) => {
        console.warn('MQTT error:', err);
        setStatus('offline');
      });

      // ---- UI helpers ----
      function updateCharCount() {
        const len = textarea.value.length;
        charCountEl.textContent = len === 0 ? '' : len;
      }

      function updatePeerCount() {
        // no visible peer count in minimal UI, but kept for internal use if needed
      }

      // ---- incoming messages ----
      client.on('message', (t, payload) => {
        if (t !== topic) return;
        try {
          const data = JSON.parse(payload.toString());

          // presence
          if (data.type === 'join' || data.type === 'ping') {
            if (data.clientId && data.clientId !== clientId) {
              peers.add(data.clientId);
              updatePeerCount();
            }
            if (data.type === 'join' && data.clientId !== clientId && textarea.value.length > 0) {
              client.publish(topic, JSON.stringify({
                type: 'state',
                content: textarea.value,
                clientId,
              }));
            }
          }
          // full state sync
          else if (data.type === 'state') {
            if (data.clientId !== clientId) {
              const start = textarea.selectionStart;
              const end = textarea.selectionEnd;
              isRemoteUpdate = true;
              textarea.value = data.content;
              const newLen = data.content.length;
              const newStart = Math.min(start, newLen);
              const newEnd = Math.min(end, newLen);
              try { textarea.setSelectionRange(newStart, newEnd); } catch (e) {}
              updateCharCount();
              isRemoteUpdate = false;
            }
          }
          // text update
          else if (data.type === 'text_update' && data.clientId !== clientId) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            isRemoteUpdate = true;
            textarea.value = data.content;
            const newLen = data.content.length;
            const newStart = Math.min(start, newLen);
            const newEnd = Math.min(end, newLen);
            try { textarea.setSelectionRange(newStart, newEnd); } catch (e) {}
            updateCharCount();
            isRemoteUpdate = false;
          }
          // clear
          else if (data.type === 'clear' && data.clientId !== clientId) {
            isRemoteUpdate = true;
            textarea.value = '';
            updateCharCount();
            isRemoteUpdate = false;
          }
        } catch (e) {
          // ignore malformed
        }
      });

      // ---- broadcast local typing ----
      function broadcastTextUpdate(immediate = false) {
        if (!client.connected) return;
        const now = Date.now();
        if (!immediate && now - lastTypingBroadcast < TYPING_THROTTLE_MS) return;
        lastTypingBroadcast = now;
        client.publish(topic, JSON.stringify({
          type: 'text_update',
          content: textarea.value,
          clientId,
        }));
      }

      let typingTimer = null;
      textarea.addEventListener('input', () => {
        if (isRemoteUpdate) return;
        updateCharCount();
        broadcastTextUpdate(false);
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
          broadcastTextUpdate(true);
        }, 70);
      });

      textarea.addEventListener('blur', () => {
        if (!isRemoteUpdate && client.connected) {
          broadcastTextUpdate(true);
        }
      });

      // ---- share button ----
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(window.location.href);
          copyBtn.textContent = 'copied';
          setTimeout(() => { copyBtn.textContent = 'share'; }, 1500);
        } catch (err) {
          prompt('Copy this link:', window.location.href);
        }
      });

      // ---- clear button ----
      clearBtn.addEventListener('click', () => {
        if (!textarea.value && !confirm('Clear notepad for everyone?')) return;
        textarea.value = '';
        updateCharCount();
        if (client.connected) {
          client.publish(topic, JSON.stringify({ type: 'clear', clientId }));
        }
        textarea.focus();
      });

      // ---- presence cleanup ----
      const peerLastSeen = new Map();
      client.on('message', (t, payload) => {
        if (t !== topic) return;
        try {
          const data = JSON.parse(payload.toString());
          if ((data.type === 'join' || data.type === 'ping') && data.clientId && data.clientId !== clientId) {
            peerLastSeen.set(data.clientId, Date.now());
            peers.add(data.clientId);
            updatePeerCount();
          }
        } catch (e) {}
      });

      setInterval(() => {
        const now = Date.now();
        for (const [id, last] of peerLastSeen.entries()) {
          if (now - last > 35000 && id !== clientId) {
            peers.delete(id);
            peerLastSeen.delete(id);
          }
        }
        if (!peers.has(clientId)) peers.add(clientId);
      }, 20000);

      // periodic ping
      setInterval(() => {
        if (client.connected) {
          client.publish(topic, JSON.stringify({ type: 'ping', clientId }));
        }
      }, 15000);

      // initial UI
      updateCharCount();
      updatePeerCount();
      textarea.focus();
    })();
  </script>
</body>
</html>
