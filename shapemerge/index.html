<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="robots" content="noindex, nofollow">
    <title>ShapeMerge · Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            position: fixed;
            top: 0;
            left: 0;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            touch-action: none;
            background: #000;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* ALL TEXT white with black shadow */
        .ui-layer {
            position: fixed;
            z-index: 20;
            pointer-events: none;
            top: 20px;
            left: 16px;
            color: #ffffff !important;
            text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 0 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.8) !important;
        }
        .btn, button {
            pointer-events: auto;
            cursor: pointer;
            background: transparent !important;
            border: none !important;
            color: #ffffff !important;
            font-size: 16px;
            font-family: monospace;
            padding: 8px 12px;
            -webkit-appearance: none;
            appearance: none;
            text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 0 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.8) !important;
        }
        .dropdown {
            position: fixed;
            z-index: 100;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border-radius: 0;
            padding: 18px 20px;
            min-width: 180px;
            box-shadow: none !important;
            pointer-events: auto;
            border: none !important;
        }
        #menuDropdown { top: 70px; right: 16px; text-align: right; }
        #advSettings, #bgSettings, #audioSettings, #codexMenu { top: 70px; right: 16px; text-align: right; max-height: 70vh; overflow-y: auto; }
        #codexMenu { left: 16px; right: 16px; width: auto; text-align: center; }
        .discovery-popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            pointer-events: none;
            text-align: center;
        }
        .tutorial {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            pointer-events: none;
            color: #ffffff !important;
            font-size: 15px;
            text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 0 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.8) !important;
            background: transparent !important;
            padding: 8px 20px;
            border-radius: 0;
            backdrop-filter: none !important;
            white-space: nowrap;
        }
        .latest {
            position: fixed;
            bottom: 30px;
            left: 16px;
            z-index: 15;
            pointer-events: none;
            font-size: 14px;
            color: #ffffff !important;
            text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 0 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.8) !important;
            background: transparent !important;
            padding: 4px 14px;
            border-radius: 0;
            backdrop-filter: none !important;
        }
        #menuBtn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 50;
            background: transparent !important;
            backdrop-filter: none !important;
            border-radius: 0;
            padding: 8px 14px;
            font-size: 20px;
            line-height: 1;
            border: none !important;
            color: #ffffff !important;
            pointer-events: auto;
            transform: scaleY(0.6);
            letter-spacing: 0;
            font-weight: 300;
            text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 0 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.8) !important;
        }
        #menuBtn div { transform: scaleY(1.6); }

        /* EVERYTHING white with black shadow */
        .dropdown button,
        .dropdown div,
        .dropdown span,
        .ui-layer div,
        .ui-layer span,
        #menuBtn,
        .btn,
        .tutorial,
        .latest,
        .bg-mode-btn,
        .audio-mode-btn,
        #discoveryPopup div {
            color: #ffffff !important;
            text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 0 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.8) !important;
        }

        #codexGrid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 12px 0;
        }
        #codexGrid canvas {
            position: relative !important;
            width: 50px !important;
            height: 50px !important;
            z-index: auto !important;
            background: transparent !important;
        }
        input[type="file"] { display: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 0; }

        /* Override any inline colors */
        [style*="color:"] {
            color: #ffffff !important;
        }
        [style*="color:#"] {
            color: #ffffff !important;
        }

        /* Audio control specific */
        .audio-mode-btn[data-mode="on"] { color: #4ade80 !important; }
        .audio-mode-btn[data-mode="off"] { color: #ff6b6b !important; }
        .audio-mode-btn { color: #ffffff !important; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- UI: always on top, positioned fixed -->
    <div class="ui-layer">
        <div style="font-size: 20px; font-weight: 700; letter-spacing: 0.5px;">ShapeMerge</div>
        <div style="font-size: 15px; opacity: 0.9; margin-top: 2px;">Shapes: <span id="shapeCount">1</span>/100</div>
    </div>

    <button id="menuBtn">≈</button>

    <!-- DROPDOWN MENUS (fixed) -->
    <div id="menuDropdown" class="dropdown" style="display: none;">
        <div style="font-size: 15px; font-weight: bold; margin-bottom: 8px;">Stats</div>
        <div style="font-size: 14px; margin-bottom: 6px;">Level: <span id="levelDisplay">1</span></div>
        <div style="font-size: 14px; margin-bottom: 6px;">Total Merges: <span id="mergeDisplay">0</span></div>
        <div style="font-size: 14px; margin-bottom: 14px;">Time Played: <span id="timeDisplay">0s</span></div>
        <button id="openAudioBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 4px;">Audio</button>
        <button id="openBgBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 4px;">Background</button>
        <button id="openAdvBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right;">Advanced</button>
    </div>

    <!-- AUDIO SETTINGS PANEL -->
    <div id="audioSettings" class="dropdown" style="display: none;">
        <div style="font-size: 15px; font-weight: bold; margin-bottom: 12px;">Audio Settings</div>
        <div style="font-size: 12px; opacity: 0.6; margin-bottom: 4px;">MASTER CONTROL</div>
        <button id="masterAudioBtn" class="btn audio-mode-btn" data-mode="on" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 12px; color: #4ade80;">Master: On</button>
        <div style="font-size: 12px; opacity: 0.6; margin-bottom: 4px;">AMBIENT MUSIC</div>
        <button id="musicToggleBtn" class="btn audio-mode-btn" data-mode="on" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 4px; color: #4ade80;">Music: On</button>
        <div style="font-size: 11px; opacity: 0.4; margin-bottom: 12px; text-align: right;">Generative ambient music (never repeats)</div>
        <div style="font-size: 12px; opacity: 0.6; margin-bottom: 4px;">SOUND EFFECTS</div>
        <button id="sfxToggleBtn" class="btn audio-mode-btn" data-mode="on" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 12px; color: #4ade80;">SFX: On</button>
        <button id="backAudioBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; padding-top: 16px;">Back</button>
    </div>

    <div id="advSettings" class="dropdown" style="display: none;">
        <div style="font-size: 15px; font-weight: bold; margin-bottom: 12px;">Advanced</div>
        <button id="autoMergeBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 12px;">Auto-Merge: Off</button>
        <button id="openCodexBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 12px;">View Codex</button>
        <button id="backAdvBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; padding-top: 12px;">Back</button>
    </div>

    <div id="codexMenu" class="dropdown" style="display: none; max-height: 70vh; overflow-y: auto; left: 16px; right: 16px; width: auto; text-align: center;">
        <div style="font-size: 15px; font-weight: bold; margin-bottom: 12px; text-align: right;">Shape Codex (<span id="codexCount">1</span>/100)</div>
        <div id="codexGrid"></div>
        <button id="backCodexBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; padding-top: 12px;">Back</button>
    </div>

    <div id="bgSettings" class="dropdown" style="display: none;">
        <div style="font-size: 15px; font-weight: bold; margin-bottom: 12px;">Background</div>
        <button id="uploadBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 4px;">Upload Image</button>
        <button id="uploadVidBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 4px;">Upload Video</button>
        <button id="unmuteVidBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 4px; display: none;">Video Sound</button>
        <button id="resetBgBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 12px;">Reset to Default</button>
        <div style="font-size: 12px; opacity: 0.6; margin-bottom: 4px;">SCALING</div>
        <button class="btn bg-mode-btn" data-mode="cover" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 4px;">Fill Screen</button>
        <button class="btn bg-mode-btn" data-mode="contain" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 4px;">Fit Screen</button>
        <button class="btn bg-mode-btn" data-mode="center" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; margin-bottom: 4px;">Center</button>
        <button class="btn bg-mode-btn" data-mode="stretch" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right;">Stretch</button>
        <button id="backBtn" class="btn" style="padding: 4px 8px; font-size: 14px; display: block; width: 100%; text-align: right; padding-top: 16px;">Back</button>
    </div>

    <input type="file" id="bgUpload" accept="image/*">
    <input type="file" id="vidUpload" accept="video/*">

    <div id="discoveryPopup" class="discovery-popup" style="display: none;"></div>
    <div id="tutorial" class="tutorial">Merge identical shapes to discover new ones!</div>
    <div id="latestDiscovery" class="latest" style="display: none;"></div>
    <script>
        // --- FULLSCREEN FIX ---
        function setViewportHeight() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', vh + 'px');
        }
        window.addEventListener('resize', setViewportHeight);
        setViewportHeight();

        // --- SHAPE DEFINITIONS ---
        const shapeNames = [
            "circle","square","triangle","diamond","pentagon","hexagon","octagon","star","oval","rectangle",
            "rhombus","trapezoid","parallelogram","kite","heart","crescent","cross","arrow","spiral","flower",
            "gear","crystal","teardrop","ring","chevron","burst","capsule","racket","eye","shield",
            "crown","hourglass","leaf","pinwheel","propeller","asterisk","snowflake","drop","flame","swoosh",
            "wave","bean","yinyang","pacman","semicircle","quartercircle","bullseye","hollowcircle","hollowsquare","hollowtriangle",
            "hollowdiamond","doublecircle","doublesquare","nestedcircles","nestedsquares","nestedtriangles","crossthick","plus","xmark","hexagram",
            "pentagram","starburst","sunburst","cog","sawblade","maltesecross","lightning","zigzag","mountain","valley",
            "house","envelope","tent","parachute","lens","vesica","reuleaux","lune","annulus","sector",
            "segment","trefoil","quatrefoil","cinquefoil","hexafoil","octafoil","medal","ladder","pill","nut",
            "tack","flag","pennant","badge","ribbon","bolt","skull","anchor","key","lock"
        ];
        const shapeColors = [];
        for(let i=0; i<100; i++) {
            const h = (i * 137.508) % 360;
            const s = 50 + (i % 20);
            const l = 65 + (i % 15);
            shapeColors.push(`hsl(${h}, ${s}%, ${l}%)`);
        }
        const shapeData = {};
        shapeNames.forEach((name, i) => {
            shapeData[name] = { sizeIndex: i, color: shapeColors[i], score: Math.floor(10 * Math.pow(1.08, i)) };
        });

        // --- PARTICLE SYSTEM ---
        let particles = [];

        function spawnDiscoveryParticles(x, y, color, count = 40) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                const size = 4 + Math.random() * 8;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: size,
                    life: 1.0,
                    decay: 0.008 + Math.random() * 0.015,
                    color: color,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.1
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.99; p.vy *= 0.99;
                p.vy += 0.02;
                p.life -= p.decay;
                p.size *= 0.995;
                p.rotation += p.rotSpeed;
                if (p.life <= 0 || p.size < 0.5) particles.splice(i, 1);
            }
        }

        function drawParticles(ctx) {
            for (const p of particles) {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                const size = p.size;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 15;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                const shape = Math.floor(Math.random() * 3);
                if (shape === 0) ctx.arc(0, 0, size, 0, Math.PI * 2);
                else if (shape === 1) {
                    ctx.moveTo(0, -size); ctx.lineTo(size, 0); ctx.lineTo(0, size); ctx.lineTo(-size, 0); ctx.closePath();
                } else {
                    ctx.moveTo(0, -size); ctx.lineTo(size, size); ctx.lineTo(-size, size); ctx.closePath();
                }
                ctx.fill();
                ctx.restore();
            }
        }

        // --- AUDIO SYSTEM ---
        let audioCtx = null;
        let musicNodes = [];
        let musicInterval = null;
        let musicActive = false;

        // Audio state
        const audioState = {
            master: true,
            music: true,
            sfx: true
        };

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function startAmbientMusic() {
            if (!audioState.master || !audioState.music || musicActive) return;
            const ctx = initAudioContext();
            if (ctx.state === 'suspended') ctx.resume();
            musicActive = true;
            scheduleAmbientNotes();
        }

        function stopAmbientMusic() {
            musicActive = false;
            if (musicInterval) {
                clearInterval(musicInterval);
                musicInterval = null;
            }
            for (const node of musicNodes) {
                try {
                    node.gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                    setTimeout(() => {
                        try { node.oscillator.stop(); node.gain.disconnect(); } catch(e) {}
                    }, 500);
                } catch(e) {}
            }
            musicNodes = [];
        }

        function scheduleAmbientNotes() {
            if (musicInterval) clearInterval(musicInterval);
            musicInterval = setInterval(() => {
                if (!musicActive || !audioState.master || !audioState.music || !audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const chords = [
                    [130.81, 164.81, 196.00, 246.94],
                    [146.83, 185.00, 220.00, 277.18],
                    [174.61, 220.00, 261.63, 329.63],
                    [196.00, 246.94, 293.66, 369.99],
                    [164.81, 207.65, 246.94, 311.13],
                    [220.00, 277.18, 329.63, 415.30]
                ];
                const chord = chords[Math.floor(Math.random() * chords.length)];
                const numNotes = 1 + Math.floor(Math.random() * 3);
                const selectedNotes = [];
                for (let i = 0; i < numNotes; i++) {
                    const idx = Math.floor(Math.random() * chord.length);
                    if (!selectedNotes.includes(idx)) selectedNotes.push(idx);
                }
                for (const idx of selectedNotes) {
                    const freq = chord[idx];
                    const detune = (Math.random() - 0.5) * 20;
                    const duration = 1.5 + Math.random() * 3;
                    const volume = 0.04 + Math.random() * 0.06;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const waveforms = ['sine', 'triangle', 'sine', 'sine'];
                    osc.type = waveforms[Math.floor(Math.random() * waveforms.length)];
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    osc.detune.setValueAtTime(detune, audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.3);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + duration);
                    musicNodes.push({ oscillator: osc, gain: gain });
                    setTimeout(() => {
                        try { osc.stop(); gain.disconnect(); } catch(e) {}
                        musicNodes = musicNodes.filter(n => n.oscillator !== osc);
                    }, duration * 1000 + 100);
                }
            }, 800 + Math.random() * 1700);
        }

        function playMergeSound(isNew) {
            if (!audioState.master || !audioState.sfx || !audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const chord = [
                [130.81,164.81,196.00,246.94], [146.83,185.00,220.00,277.18],
                [174.61,220.00,261.63,329.63], [196.00,246.94,293.66,369.99]
            ][state.level % 4];
            const baseFreq = chord[Math.floor(Math.random() * chord.length)];
            [-10,0,10].forEach(detune => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(isNew ? baseFreq*2 : baseFreq, audioCtx.currentTime);
                o.detune.setValueAtTime(detune, audioCtx.currentTime);
                o.connect(g); g.connect(audioCtx.destination);
                g.gain.setValueAtTime(0.001, audioCtx.currentTime);
                g.gain.linearRampToValueAtTime(isNew ? 0.15 : 0.08, audioCtx.currentTime + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (isNew ? 1.2 : 0.8));
                o.start(audioCtx.currentTime);
                o.stop(audioCtx.currentTime + (isNew ? 1.2 : 0.8));
            });
        }

        function updateAudioUI() {
            const masterBtn = document.getElementById('masterAudioBtn');
            const musicBtn = document.getElementById('musicToggleBtn');
            const sfxBtn = document.getElementById('sfxToggleBtn');

            masterBtn.textContent = audioState.master ? 'Master: On' : 'Master: Off';
            masterBtn.style.color = audioState.master ? '#4ade80' : '#ff6b6b';
            masterBtn.dataset.mode = audioState.master ? 'on' : 'off';

            musicBtn.textContent = audioState.music ? 'Music: On' : 'Music: Off';
            musicBtn.style.color = audioState.music ? '#4ade80' : '#ff6b6b';
            musicBtn.dataset.mode = audioState.music ? 'on' : 'off';

            sfxBtn.textContent = audioState.sfx ? 'SFX: On' : 'SFX: Off';
            sfxBtn.style.color = audioState.sfx ? '#4ade80' : '#ff6b6b';
            sfxBtn.dataset.mode = audioState.sfx ? 'on' : 'off';
        }

        // --- STATE ---
        const state = { shapes: [], score: 0, merges: 0, discovered: ["circle"], level: 1, muted: false, drag: null, lastMergeTime: Date.now() };
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let dpr = window.devicePixelRatio || 1;

        // --- TIME TRACKING ---
        let sessionStartTime = Date.now();
        let totalTimePlayed = 0;
        let timeUpdateInterval = null;

        function updateTimeDisplay() {
            const elapsed = Math.floor((Date.now() - sessionStartTime + totalTimePlayed) / 1000);
            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;
            let timeStr = '';
            if (hours > 0) timeStr += hours + 'h ';
            if (minutes > 0 || hours > 0) timeStr += minutes + 'm ';
            timeStr += seconds + 's';
            document.getElementById('timeDisplay').innerText = timeStr;
        }

        function loadTotalTime() {
            try { const saved = localStorage.getItem('shapeMergeTotalTime'); if (saved) totalTimePlayed = parseInt(saved) || 0; } catch(e) {}
        }
        function saveTotalTime() {
            try { localStorage.setItem('shapeMergeTotalTime', String(totalTimePlayed + (Date.now() - sessionStartTime))); } catch(e) {}
        }
        loadTotalTime();
        timeUpdateInterval = setInterval(updateTimeDisplay, 1000);

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            const w = window.innerWidth, h = window.innerHeight;
            canvas.width = w * dpr; canvas.height = h * dpr;
            canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- HELPERS ---
        function getBaseSize() { return Math.min(50, Math.max(30, Math.min(window.innerWidth, window.innerHeight) * 0.11)); }
        function createShape(type, x, y) {
            const data = shapeData[type];
            const size = getBaseSize() + data.sizeIndex * 0.12;
            const r = size / 2;
            const spawnW = Math.max(1, window.innerWidth - r*2);
            const spawnH = Math.max(1, window.innerHeight - r*2);
            const shape = {
                id: Math.random().toString(36).substr(2,9),
                type,
                size,
                color: data.color,
                x: x ?? (r + Math.random() * spawnW),
                y: y ?? (r + Math.random() * spawnH)
            };
            shape.x = Math.max(r, Math.min(window.innerWidth - r, shape.x));
            shape.y = Math.max(r, Math.min(window.innerHeight - r, shape.y));
            return shape;
        }
        function initGame() { state.shapes = [createShape("circle"), createShape("circle")]; }
        function spawnBaseShapes() { if (state.shapes.length >= 15) return; const c = state.shapes.filter(s => s.type === "circle").length; if (c < 2) for (let i=0; i<2-c; i++) state.shapes.push(createShape("circle")); }

        function mergeShapes(s1, s2) {
            state.shapes = state.shapes.filter(s => s !== s1 && s !== s2);
            const idx = shapeNames.indexOf(s1.type);
            const nextType = shapeNames[Math.min(idx+1, shapeNames.length-1)];
            const nextData = shapeData[nextType];
            const newX = (s1.x + s2.x) / 2;
            const newY = (s1.y + s2.y) / 2;
            state.shapes.push(createShape(nextType, newX, newY));
            state.score += nextData.score; state.merges++; state.level = Math.floor(state.merges/5)+1;
            state.lastMergeTime = Date.now();
            const isNew = !state.discovered.includes(nextType);
            if (isNew) {
                state.discovered.push(nextType);
                showDiscovery(nextType);
                spawnDiscoveryParticles(newX, newY, nextData.color, 50);
            }
            playMergeSound(isNew); spawnBaseShapes(); updateUI(); saveProgress();
        }

        // --- DRAW ---
        function drawShape(ctx, shape, isDragging) {
            const d = shape.size / 2;
            ctx.save();
            ctx.translate(shape.x, shape.y);
            ctx.filter = 'blur(0.8px)';
            ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
            ctx.shadowColor = isDragging ? shape.color : '#000000';
            ctx.shadowBlur = isDragging ? 25 : 15;
            ctx.fillStyle = shape.color;
            ctx.lineWidth = 0;
            ctx.beginPath();
            drawShapeFull(ctx, shape, d, isDragging);
            ctx.restore();
        }

        function drawShapeFull(ctx, shape, d, isDragging) {
            const type = shape.type;
            ctx.beginPath();
            switch(type) {
                case "circle": ctx.arc(0,0,d,0,Math.PI*2); break;
                case "square": ctx.fillRect(-d,-d,d*2,d*2); ctx.restore(); return;
                case "triangle": ctx.moveTo(0,-d); ctx.lineTo(d,d); ctx.lineTo(-d,d); ctx.closePath(); break;
                case "diamond": ctx.moveTo(0,-d); ctx.lineTo(d,0); ctx.lineTo(0,d); ctx.lineTo(-d,0); ctx.closePath(); break;
                case "pentagon": for(let i=0;i<5;i++){const a=i*2*Math.PI/5-Math.PI/2;i===0?ctx.moveTo(Math.cos(a)*d,Math.sin(a)*d):ctx.lineTo(Math.cos(a)*d,Math.sin(a)*d);} ctx.closePath(); break;
                case "hexagon": for(let i=0;i<6;i++){const a=i*Math.PI/3;i===0?ctx.moveTo(Math.cos(a)*d,Math.sin(a)*d):ctx.lineTo(Math.cos(a)*d,Math.sin(a)*d);} ctx.closePath(); break;
                case "octagon": for(let i=0;i<8;i++){const a=i*2*Math.PI/8-Math.PI/2;i===0?ctx.moveTo(Math.cos(a)*d,Math.sin(a)*d):ctx.lineTo(Math.cos(a)*d,Math.sin(a)*d);} ctx.closePath(); break;
                case "star": for(let i=0;i<10;i++){const r=i%2===0?d:d*0.4;const a=i*Math.PI/5;i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);} ctx.closePath(); break;
                case "oval": ctx.ellipse(0,0,d*1.3,d*0.8,0,0,Math.PI*2); break;
                case "rectangle": ctx.fillRect(-d,-d*0.6,d*2,d*1.2); ctx.restore(); return;
                case "rhombus": ctx.moveTo(0,-d); ctx.lineTo(d*0.6,0); ctx.lineTo(0,d); ctx.lineTo(-d*0.6,0); ctx.closePath(); break;
                case "trapezoid": ctx.moveTo(-d*0.6,-d); ctx.lineTo(d*0.6,-d); ctx.lineTo(d,d); ctx.lineTo(-d,d); ctx.closePath(); break;
                case "parallelogram": ctx.moveTo(-d*0.7,-d); ctx.lineTo(d*0.7,-d); ctx.lineTo(d,d); ctx.lineTo(-d*0.4,d); ctx.closePath(); break;
                case "kite": ctx.moveTo(0,-d); ctx.lineTo(d*0.5,-d*0.2); ctx.lineTo(0,d); ctx.lineTo(-d*0.5,-d*0.2); ctx.closePath(); break;
                case "heart": ctx.moveTo(0,d*0.3); ctx.bezierCurveTo(0,0,-d,0,-d,d*0.3); ctx.bezierCurveTo(-d,d*0.6,0,d,0,d*0.7); ctx.bezierCurveTo(0,d,d,d*0.6,d,d*0.3); ctx.bezierCurveTo(d,0,0,0,0,d*0.3); break;
                case "crescent": ctx.arc(0,0,d,0,Math.PI*2); ctx.moveTo(d*0.3+d*0.7,0); ctx.arc(d*0.3,0,d*0.7,0,Math.PI*2,true); break;
                case "cross": const cw=d*0.3; ctx.fillRect(-d,-cw,d*2,cw*2); ctx.fillRect(-cw,-d,cw*2,d*2); ctx.restore(); return;
                case "arrow": ctx.moveTo(0,-d); ctx.lineTo(d*0.5,-d*0.3); ctx.lineTo(d*0.2,-d*0.3); ctx.lineTo(d*0.2,d); ctx.lineTo(-d*0.2,d); ctx.lineTo(-d*0.2,-d*0.3); ctx.lineTo(-d*0.5,-d*0.3); ctx.closePath(); break;
                case "spiral": for(let i=0;i<100;i++){const a=i*0.2,r=i/100*d;i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);} break;
                case "flower": for(let i=0;i<5;i++){const a=i*2*Math.PI/5;ctx.ellipse(Math.cos(a)*d*0.5,Math.sin(a)*d*0.5,d*0.5,d*0.2,a,0,Math.PI*2);} break;
                default: ctx.arc(0,0,d,0,Math.PI*2); break;
            }
            ctx.fill();
            if (isDragging) { ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 3; ctx.stroke(); }
            ctx.filter = 'none';
        }

        // --- BACKGROUND ---
        let bgImage = null, bgVideo = null, bgMode = 'cover';
        function getDrawDimensions(srcW, srcH, screenW, screenH, mode) {
            const srcRatio = srcW/srcH, screenRatio = screenW/screenH;
            let drawW, drawH, drawX, drawY;
            if (mode === 'stretch') { drawW=screenW; drawH=screenH; drawX=0; drawY=0; }
            else if (mode === 'center') { drawW=srcW; drawH=srcH; drawX=(screenW-drawW)/2; drawY=(screenH-drawH)/2; }
            else if (mode === 'contain') {
                if (screenRatio > srcRatio) { drawH=screenH; drawW=screenH*srcRatio; } else { drawW=screenW; drawH=screenW/srcRatio; }
                drawX=(screenW-drawW)/2; drawY=(screenH-drawH)/2;
            } else {
                if (screenRatio > srcRatio) { drawW=screenW; drawH=screenW/srcRatio; } else { drawH=screenH; drawW=screenH*srcRatio; }
                drawX=(screenW-drawW)/2; drawY=(screenH-drawH)/2;
            }
            return { drawX, drawY, drawW, drawH };
        }
        function drawBackground() {
            const w = window.innerWidth, h = window.innerHeight;
            if (bgVideo && !bgVideo.paused && !bgVideo.ended && bgVideo.readyState >= 2) {
                const dim = getDrawDimensions(bgVideo.videoWidth, bgVideo.videoHeight, w, h, bgMode);
                ctx.drawImage(bgVideo, dim.drawX, dim.drawY, dim.drawW, dim.drawH);
            } else if (bgImage) {
                const dim = getDrawDimensions(bgImage.width, bgImage.height, w, h, bgMode);
                ctx.drawImage(bgImage, dim.drawX, dim.drawY, dim.drawW, dim.drawH);
            } else {
                ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
            }
        }

        // --- INTERACTION ---
        function getShapeAt(x,y) { for (let i=state.shapes.length-1; i>=0; i--) { const s=state.shapes[i]; if (Math.hypot(x-s.x, y-s.y) <= s.size/1.5) return s; } return null; }
        function isColliding(s1,s2) { return Math.hypot(s1.x-s2.x, s1.y-s2.y) < (s1.size+s2.size)/2.5; }

        canvas.addEventListener('pointerdown', e => {
            const ctx = initAudioContext();
            if (ctx.state === 'suspended') ctx.resume();
            if (!musicActive && audioState.master && audioState.music) startAmbientMusic();
            const r = canvas.getBoundingClientRect();
            const x = e.clientX - r.left, y = e.clientY - r.top;
            const shape = getShapeAt(x,y);
            if (shape) { state.drag = { shape, offsetX: x-shape.x, offsetY: y-shape.y }; state.shapes = state.shapes.filter(s=>s!==shape); state.shapes.push(shape); }
        });
        canvas.addEventListener('pointermove', e => {
            if (!state.drag) return; e.preventDefault();
            const r = canvas.getBoundingClientRect();
            const x = e.clientX - r.left, y = e.clientY - r.top;
            const s = state.drag.shape;
            s.x = Math.max(s.size/2, Math.min(window.innerWidth - s.size/2, x - state.drag.offsetX));
            s.y = Math.max(s.size/2, Math.min(window.innerHeight - s.size/2, y - state.drag.offsetY));
            for (const other of state.shapes) {
                if (other !== s && other.type === s.type && isColliding(s, other)) {
                    mergeShapes(s, other); state.drag = null; break;
                }
            }
        });
        canvas.addEventListener('pointerup', ()=> { state.drag = null; });
        canvas.addEventListener('pointercancel', ()=> { state.drag = null; });

        // --- UI ---
        const menuBtn = document.getElementById('menuBtn');
        const menuDropdown = document.getElementById('menuDropdown');
        const bgSettings = document.getElementById('bgSettings');
        const audioSettings = document.getElementById('audioSettings');
        const advSettings = document.getElementById('advSettings');
        const codexMenu = document.getElementById('codexMenu');
        const discoveryPopup = document.getElementById('discoveryPopup');
        const tutorial = document.getElementById('tutorial');
        const latestDiscovery = document.getElementById('latestDiscovery');
        let discoveryTimeout;

        function closeMenus() {
            menuDropdown.style.display='none';
            bgSettings.style.display='none';
            audioSettings.style.display='none';
            advSettings.style.display='none';
            codexMenu.style.display='none';
        }
        function showDiscovery(type) {
            discoveryPopup.innerHTML = `<div style="font-size:${24+state.level*2}px;font-weight:bold;">${type}!</div>`;
            discoveryPopup.style.display='block';
            latestDiscovery.innerHTML = `Latest: ${type}`; latestDiscovery.style.display='block';
            tutorial.style.display='none';
            clearTimeout(discoveryTimeout);
            discoveryTimeout = setTimeout(() => { discoveryPopup.style.display='none'; }, 2000);
        }
        function updateUI() {
            document.getElementById('shapeCount').innerText = state.discovered.length;
            document.getElementById('levelDisplay').innerText = state.level;
            document.getElementById('mergeDisplay').innerText = state.merges.toLocaleString();
            if (state.merges > 0 && state.merges < 3) tutorial.innerText = `Great! You discovered ${state.discovered[state.discovered.length-1]}! Keep merging!`;
            else if (state.merges >= 3) tutorial.style.display = 'none';
            updateTimeDisplay();
        }

        menuBtn.addEventListener('click', e => { e.stopPropagation(); const isVisible = menuDropdown.style.display==='block'||bgSettings.style.display==='block'||audioSettings.style.display==='block'||advSettings.style.display==='block'||codexMenu.style.display==='block'; closeMenus(); if (!isVisible) menuDropdown.style.display='block'; });
        document.addEventListener('click', e => { if (!menuDropdown.contains(e.target) && !bgSettings.contains(e.target) && !audioSettings.contains(e.target) && !advSettings.contains(e.target) && !codexMenu.contains(e.target) && e.target!==menuBtn) closeMenus(); });

        // --- AUDIO CONTROLS ---
        document.getElementById('openAudioBtn').addEventListener('click', e => {
            e.stopPropagation();
            menuDropdown.style.display='none';
            audioSettings.style.display='block';
            updateAudioUI();
        });
        document.getElementById('backAudioBtn').addEventListener('click', e => {
            e.stopPropagation();
            audioSettings.style.display='none';
            menuDropdown.style.display='block';
        });

        // Master Audio Toggle
        document.getElementById('masterAudioBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            audioState.master = !audioState.master;
            if (!audioState.master) {
                stopAmbientMusic();
                if (audioCtx && audioCtx.state === 'running') {
                    audioCtx.suspend();
                }
            } else {
                const ctx = initAudioContext();
                if (ctx.state === 'suspended') ctx.resume();
                if (audioState.music) startAmbientMusic();
            }
            updateAudioUI();
            saveProgress();
        });

        // Music Toggle
        document.getElementById('musicToggleBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            audioState.music = !audioState.music;
            if (!audioState.music || !audioState.master) {
                stopAmbientMusic();
            } else {
                const ctx = initAudioContext();
                if (ctx.state === 'suspended') ctx.resume();
                startAmbientMusic();
            }
            updateAudioUI();
            saveProgress();
        });

        // SFX Toggle
        document.getElementById('sfxToggleBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            audioState.sfx = !audioState.sfx;
            updateAudioUI();
            saveProgress();
        });

        document.getElementById('openBgBtn').addEventListener('click', e => { e.stopPropagation(); menuDropdown.style.display='none'; bgSettings.style.display='block'; });
        document.getElementById('backBtn').addEventListener('click', e => { e.stopPropagation(); bgSettings.style.display='none'; menuDropdown.style.display='block'; });
        document.getElementById('openAdvBtn').addEventListener('click', e => { e.stopPropagation(); menuDropdown.style.display='none'; advSettings.style.display='block'; });
        document.getElementById('backAdvBtn').addEventListener('click', e => { e.stopPropagation(); advSettings.style.display='none'; menuDropdown.style.display='block'; });
        document.getElementById('openCodexBtn').addEventListener('click', e => { e.stopPropagation(); advSettings.style.display='none'; buildCodex(); codexMenu.style.display='block'; });
        document.getElementById('backCodexBtn').addEventListener('click', e => { e.stopPropagation(); codexMenu.style.display='none'; advSettings.style.display='block'; });

        // background uploads
        const bgUpload = document.getElementById('bgUpload');
        document.getElementById('uploadBtn').addEventListener('click', e => { e.stopPropagation(); bgUpload.click(); });
        bgUpload.addEventListener('change', e => {
            const file = e.target.files[0]; if (!file) return;
            if (bgVideo) { bgVideo.pause(); bgVideo.removeAttribute('src'); bgVideo.load(); bgVideo=null; }
            const reader = new FileReader();
            reader.onload = function(ev) { const img = new Image(); img.onload = function() { bgImage=img; saveProgress(); }; img.src = ev.target.result; };
            reader.readAsDataURL(file); bgUpload.value='';
        });
        const vidUpload = document.getElementById('vidUpload');
        document.getElementById('uploadVidBtn').addEventListener('click', e => { e.stopPropagation(); vidUpload.click(); });
        vidUpload.addEventListener('change', e => {
            const file = e.target.files[0]; if (!file) return;
            bgImage=null;
            if (bgVideo) { bgVideo.pause(); bgVideo.removeAttribute('src'); bgVideo.load(); }
            bgVideo = document.createElement('video');
            bgVideo.src = URL.createObjectURL(file);
            bgVideo.muted = true; bgVideo.playsInline = true; bgVideo.loop = true;
            bgVideo.play();
            vidUpload.value='';
            document.getElementById('unmuteVidBtn').style.display='block';
            document.getElementById('unmuteVidBtn').innerText = "Play Video Sound";
        });
        document.getElementById('resetBgBtn').addEventListener('click', e => { e.stopPropagation(); bgImage=null; if(bgVideo){bgVideo.pause();bgVideo.removeAttribute('src');bgVideo.load();bgVideo=null;} document.getElementById('unmuteVidBtn').style.display='none'; saveProgress(); });
        document.getElementById('unmuteVidBtn').addEventListener('click', e => { e.stopPropagation(); if(bgVideo){ bgVideo.muted=false; document.getElementById('unmuteVidBtn').innerText="Video Sound: On"; } });

        const modeButtons = document.querySelectorAll('.bg-mode-btn');
        modeButtons.forEach(btn => {
            btn.addEventListener('click', e => { e.stopPropagation(); bgMode = btn.getAttribute('data-mode'); modeButtons.forEach(b=>b.style.color='#ffffff'); btn.style.color='#ffffff'; saveProgress(); });
        });

        // auto merge
        let autoMergeState = 0;
        const autoMergeBtn = document.getElementById('autoMergeBtn');
        autoMergeBtn.addEventListener('click', e => { e.stopPropagation(); autoMergeState = (autoMergeState+1)%3; if(autoMergeState===0){ autoMergeBtn.innerText="Auto-Merge: Off"; autoMergeBtn.style.color='#ffffff'; } else if(autoMergeState===1){ autoMergeBtn.innerText="Auto-Merge: Touch"; autoMergeBtn.style.color='#ffffff'; } else { autoMergeBtn.innerText="Auto-Merge: Instant"; autoMergeBtn.style.color='#ffffff'; } saveProgress(); });
        function checkInstantMerge() { if(autoMergeState!==2 || state.drag) return; for(let i=0;i<state.shapes.length;i++){ for(let j=i+1;j<state.shapes.length;j++){ if(state.shapes[i].type===state.shapes[j].type && state.shapes[i].type!=="circle"){ const s1=state.shapes[i], s2=state.shapes[j]; const mx=(s1.x+s2.x)/2, my=(s1.y+s2.y)/2; s1.x=mx; s1.y=my; s2.x=mx; s2.y=my; mergeShapes(s1,s2); return; } } } }
        function checkAutoMerge() { if(autoMergeState!==1 || state.drag) return; for(let i=0;i<state.shapes.length;i++){ for(let j=i+1;j<state.shapes.length;j++){ if(state.shapes[i].type===state.shapes[j].type && isColliding(state.shapes[i],state.shapes[j])){ mergeShapes(state.shapes[i],state.shapes[j]); return; } } } }

        function buildCodex() {
            const grid = document.getElementById('codexGrid');
            grid.innerHTML = '';
            document.getElementById('codexCount').innerText = state.discovered.length;
            const sorted = [...state.discovered].sort((a,b) => shapeNames.indexOf(a)-shapeNames.indexOf(b));
            sorted.forEach(name => {
                const color = shapeData[name].color;
                const item = document.createElement('div');
                item.style.cssText = 'display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:70px;margin:5px;vertical-align:top;';
                const c = document.createElement('canvas');
                c.width = 50; c.height = 50; c.style.width = '50px'; c.style.height = '50px';
                c.style.background = 'transparent';
                const cc = c.getContext('2d');
                cc.clearRect(0, 0, 50, 50);
                const fakeShape = { type: name, size: 32, color: color, x: 25, y: 25 };
                drawShape(cc, fakeShape, false);
                const label = document.createElement('div');
                label.style.cssText = 'font-size:11px;margin-top:6px;color:#ffffff;text-transform:capitalize;text-align:center;text-shadow:0 0 8px rgba(0,0,0,0.95), 0 0 20px rgba(0,0,0,0.9);';
                label.innerText = name;
                item.appendChild(c); item.appendChild(label); grid.appendChild(item);
            });
            if (sorted.length === 0) grid.innerHTML = '<div style="color:#ffffff;width:100%;padding:20px;text-shadow:0 0 8px rgba(0,0,0,0.95), 0 0 20px rgba(0,0,0,0.9);">No shapes discovered yet!</div>';
        }

        // --- SAVE/LOAD ---
        const SAVE_KEY = 'shapeMergeSave';
        function saveProgress() {
            try {
                // Save all shapes with their exact positions
                const shapesData = state.shapes.map(s => ({
                    type: s.type,
                    x: s.x,
                    y: s.y,
                    size: s.size,
                    color: s.color,
                    id: s.id
                }));

                const saveData = {
                    discovered: state.discovered,
                    score: state.score,
                    merges: state.merges,
                    level: state.level,
                    muted: state.muted,
                    bgMode: bgMode,
                    autoMergeState: autoMergeState,
                    audioState: audioState,
                    shapes: shapesData,  // Save all shapes with positions
                    bgImageData: bgImage ? bgImage.src : null,
                    saveVersion: 3
                };
                localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
            } catch(e) {
                console.log('Save error:', e);
            }
        }

        function loadProgress() {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return false;
            try {
                let data = JSON.parse(raw);

                // Load discovered shapes
                state.discovered = Array.isArray(data.discovered) ? data.discovered.filter(n=>shapeNames.includes(n)) : ["circle"];
                if (!state.discovered.includes("circle")) state.discovered.unshift("circle");

                // Load stats
                state.score = data.score || 0;
                state.merges = data.merges || 0;
                state.level = data.level || 1;
                state.muted = data.muted || false;

                // Load settings
                if (data.bgMode) bgMode = data.bgMode;
                if (typeof data.autoMergeState === 'number') autoMergeState = data.autoMergeState;
                if (data.audioState) {
                    audioState.master = data.audioState.master !== undefined ? data.audioState.master : true;
                    audioState.music = data.audioState.music !== undefined ? data.audioState.music : true;
                    audioState.sfx = data.audioState.sfx !== undefined ? data.audioState.sfx : true;
                }

                // Load background image
                if (data.bgImageData) {
                    const img = new Image();
                    img.onload = function(){ bgImage=img; };
                    img.src = data.bgImageData;
                }

                // Load shapes with their exact positions
                if (data.shapes && Array.isArray(data.shapes) && data.shapes.length > 0) {
                    state.shapes = data.shapes.map(s => ({
                        type: s.type,
                        x: s.x,
                        y: s.y,
                        size: s.size,
                        color: s.color || shapeData[s.type]?.color || '#ffffff',
                        id: s.id || Math.random().toString(36).substr(2,9)
                    }));
                } else {
                    // Fallback: create shapes from discovered
                    restoreShapesFallback();
                }

                return true;
            } catch(e) {
                console.log('Load error:', e);
                return false;
            }
        }

        function restoreShapesFallback() {
            state.shapes = [];
            if (state.discovered.length > 1) {
                const highest = state.discovered[state.discovered.length-1];
                state.shapes.push(createShape(highest));
                if (state.discovered.length > 2) {
                    state.shapes.push(createShape(state.discovered[state.discovered.length-2]));
                }
            }
            spawnBaseShapes();
        }

        function syncUIFromState() {
            // Audio UI
            updateAudioUI();

            // Auto-merge UI
            if (autoMergeState===0) {
                autoMergeBtn.innerText="Auto-Merge: Off";
                autoMergeBtn.style.color='#ffffff';
            } else if (autoMergeState===1) {
                autoMergeBtn.innerText="Auto-Merge: Touch";
                autoMergeBtn.style.color='#ffffff';
            } else {
                autoMergeBtn.innerText="Auto-Merge: Instant";
                autoMergeBtn.style.color='#ffffff';
            }

            // Background mode buttons
            modeButtons.forEach(b=>{
                b.style.color = b.getAttribute('data-mode') === bgMode ? '#facc15' : '#ffffff';
            });

            // Latest discovery
            if (state.discovered.length>1) {
                const latest=state.discovered[state.discovered.length-1];
                latestDiscovery.innerHTML=`Latest: ${latest}`;
                latestDiscovery.style.display='block';
                tutorial.style.display='none';
            }

            // Start music if enabled
            if (audioState.master && audioState.music) {
                const ctx = initAudioContext();
                if (ctx.state === 'suspended') ctx.resume();
                startAmbientMusic();
            }
        }

        // --- INIT ---
        const hadSave = loadProgress();
        if (hadSave) {
            syncUIFromState();
        } else {
            initGame();
        }
        updateUI();

        // --- LOOP ---
        function gameLoop() {
            ctx.setTransform(dpr,0,0,dpr,0,0);
            drawBackground();
            checkInstantMerge();
            checkAutoMerge();
            const dragged = state.drag ? state.drag.shape : null;
            state.shapes.forEach(s => { if (s !== dragged) drawShape(ctx, s, false); });
            if (dragged) drawShape(ctx, dragged, true);
            drawParticles(ctx);
            updateParticles();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        // --- SAVE ON UNLOAD ---
        window.addEventListener('beforeunload', () => {
            saveTotalTime();
            saveProgress();
            stopAmbientMusic();
        });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                saveTotalTime();
                saveProgress();
            } else if (document.visibilityState === 'visible' && audioState.master && audioState.music) {
                const ctx = initAudioContext();
                if (ctx.state === 'suspended') ctx.resume();
                startAmbientMusic();
            }
        });

        // --- PLAY REMINDER ---
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }
        function sendPlayReminder() {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('ShapeMerge', { body: 'Your shapes are waiting! Come merge and discover new ones.' });
            }
        }
        document.addEventListener('click', requestNotificationPermission, { once: true });
        document.addEventListener('touchstart', requestNotificationPermission, { once: true });
        setInterval(() => {
            if (Date.now() - (state.lastMergeTime || Date.now()) > 1800000) sendPlayReminder();
        }, 7200000);

        console.log('ShapeMerge loaded with full save/restore including shape positions!');
    </script>
</body>
</html>
