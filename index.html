<body class="home-route">
<div class="site-shell">

    <a href="./" class="brand-link" aria-label="DDGC home"><img src="assets/logo.png" alt="DDGC, Divine Dream Group of Companies"></a>
    <a href="anybody" class="desktop-anybody">AnyBody</a>
  </header>
